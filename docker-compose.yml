version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: ati-mysql
    restart: unless-stopped
    environment:
      # These default from the host environment or use the fallback values below
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-example}
      MYSQL_DATABASE: ${DB_NAME:-staff_platform}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASS:-example}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer:latest
    container_name: ati-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db_data:
